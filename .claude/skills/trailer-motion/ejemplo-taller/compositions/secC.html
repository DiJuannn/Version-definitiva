<div id="secC-root" data-composition-id="secC" data-width="1920" data-height="1080" data-duration="12">

      if (p <= 0) return 0; if (p >= 1) return 1;

      for (let i = 0; i < 6; i++) { const e = sx(t) - p, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }

      card.style.transform = `translateY(${f1(cardBump(t))}px)`;
    }

    /* ---------- VISOR (5.1 – 8.9) ---------- */
    const hudOn = t >= 5.1 && t < 8.9;
    if (!hudOn) { COR.forEach((e) => setS(e, "opacity", "0")); THD.forEach((e) => setS(e, "opacity", "0")); [xh, htl, htr, nameW, slots].forEach((e) => setS(e, "opacity", "0")); }
    else {
      let rc, op = 1;
      const pgW = frWorld(FR.PG);
      if (t < 5.42) { const p = eLand(c01((t - 5.1) / 0.32)); const tg = projRect(c, pgW); rc = { l: lerp(-60, tg.l, p), t: lerp(-60, tg.t, p), r: lerp(1980, tg.r, p), b: lerp(1140, tg.b, p) }; op = c01((t - 5.1) / 0.06); }
      else if (t < H.board - 0.18) {
        // el marco salta al tamaño siguiente justo antes del disparo; la cámara lo alcanza después
        let F = FR.PG;
        for (let i = 1; i < 4; i++) {
          const ta = SHOTS[i].t - 0.1;
          if (t >= SHOTS[i].t) F = FR[SHOTS[i].k];
          else if (t >= ta) { const A = frWorld(FR[SHOTS[i - 1].k]), B = frWorld(FR[SHOTS[i].k]), p = eLand(c01((t - ta) / 0.1)); rc = projRect(c, { l: lerp(A.l, B.l, p), t: lerp(A.t, B.t, p), r: lerp(A.r, B.r, p), b: lerp(A.b, B.b, p) }); }
        }
        if (!rc) rc = projRect(c, frWorld(F));
      } else if (t < H.board) {
        const p = eExit(c01((t - (H.board - 0.18)) / 0.16)), A = projRect(c, frWorld(FR.PD)), k = lerp(1, 0.12, p);
        const cx = (A.l + A.r) / 2, cy = (A.t + A.b) / 2;
        rc = { l: cx - (cx - A.l) * k, t: cy - (cy - A.t) * k, r: cx + (A.r - cx) * k, b: cy + (A.b - cy) * k };
      } else {
        const B = projRect(c, panRect(0)), p = eLand(c01((t - H.board) / 0.22)), k = lerp(0.12, 1, p);
        const cx = (B.l + B.r) / 2, cy = (B.t + B.b) / 2;
        rc = { l: cx - (cx - B.l) * k, t: cy - (cy - B.t) * k, r: cx + (B.r - cx) * k, b: cy + (B.b - cy) * k };
        op = 1 - c01((t - 8.55) / 0.3);
      }
      const CS = 64, ins = 0;
      const pos = [[rc.l - ins, rc.t - ins], [rc.r - CS + ins, rc.t - ins], [rc.l - ins, rc.b - CS + ins], [rc.r - CS + ins, rc.b - CS + ins]];
      // pulso de enfoque en cada disparo
      let pz = 0; SHOTS.forEach((s) => { const u = t - s.t; if (u >= 0 && u < 0.3) pz = Math.max(pz, Math.sin((u / 0.3) * Math.PI) * 10); });
      COR.forEach((e, i) => { const sx = i % 2 ? 1 : -1, sy = i < 2 ? -1 : 1; e.style.transform = `translate(${f1(pos[i][0] + sx * pz)}px,${f1(pos[i][1] + sy * pz)}px)`; setS(e, "opacity", f3(op)); });
      const hud = t >= 5.56 && t < H.board ? 1 : 0;
      const w = rc.r - rc.l, h = rc.b - rc.t;
      [[rc.l + w / 3, rc.t, 1.5, h], [rc.l + (2 * w) / 3, rc.t, 1.5, h], [rc.l, rc.t + h / 3, w, 1.5], [rc.l, rc.t + (2 * h) / 3, w, 1.5]].forEach((g, i) => {
        THD[i].style.transform = `translate(${f1(g[0])}px,${f1(g[1])}px)`; THD[i].style.width = f1(g[2]) + "px"; THD[i].style.height = f1(g[3]) + "px"; setS(THD[i], "opacity", hud ? "0.2" : "0");
      });
      setS(xh, "opacity", hud ? "0.8" : "0");
      const hin = eLand(c01((t - 5.56) / 0.35));
      setS(htl, "opacity", hud ? "1" : "0"); htl.style.transform = `translateX(${f1(-40 * (1 - hin))}px)`;
      setS(htr, "opacity", hud ? "1" : "0");
      setS(slots, "opacity", hud ? "1" : "0"); slots.style.transform = `translateY(${f1(60 * (1 - hin))}px)`;
      let si = -1; SHOTS.forEach((s, i) => { if (t >= s.t) si = i; });
      setS(nameW, "opacity", hud && si >= 0 ? "1" : "0");
      if (si !== lastShot) {
        lastShot = si; const s = SHOTS[Math.max(0, si)];
        code.textContent = s.code; codeN.textContent = `Plano ${Math.max(1, si + 1)} / 4`; nameB.textContent = s.name; abbr.textContent = s.k;
        SLOTS.forEach((sl, i) => { sl.sv.style.opacity = i <= si ? "1" : "0"; sl.lb.style.background = i === si ? "#f0c94a" : "rgba(21,21,25,.72)"; sl.lb.style.color = i === si ? "#151519" : "#f1eee6"; sl.el.style.borderStyle = i <= si ? "solid" : "dashed"; });
      }
      if (si >= 0) {
        const u = t - SHOTS[si].t, p = outPow(u / 0.22, 4);
        nameB.style.transform = `scale(${f3(lerp(1.22, 1, p))})`;
        code.style.transform = `translateY(${f1(-18 * (1 - p))}px)`;
        SLOTS.forEach((sl, i) => { const v = t - SHOTS[i].t; sl.el.style.transform = v >= 0 && v < 0.4 ? `translateY(${f1(-16 * (1 - eLand(v / 0.4)))}px) scale(${f3(1 + 0.12 * (1 - eLand(v / 0.4)))})` : "none"; });
      }
    }
    /* ---------- obturador ---------- */
    let fl = 0;
    [H.shot1, H.shot2, H.shot3, H.shot4, H.board].forEach((h, i) => { const u = t - h; if (u >= 0 && u < 0.14) fl = Math.max(fl, (i === 4 ? 1 : 0.62) * Math.pow(1 - u / 0.14, 1.6)); });
    setS(flash, "opacity", f3(fl));

    /* ---------- STORYBOARD (8.0 →) ---------- */
    if (t >= H.board - 0.05) {
      PANS.forEach((P) => {
        const u = t - P.start;
        if (P.done && u > 1.3) return;
        const n = P.sk.length;
        P.sk.forEach((el, j) => {
          const k = j === n - 1 ? 0 : 0.05 + (j / n) * 0.36;            // el marco primero
          const p = c01((u - k) / (j === n - 1 ? 0.3 : 0.38));
          const e = eSettle(p);
          if (p <= 0) { if (el.style.visibility !== "hidden") el.style.visibility = "hidden"; }
          else { if (el.style.visibility !== "visible") el.style.visibility = "visible"; el.setAttribute("stroke-dashoffset", (1 - e).toFixed(4)); }
        });
        P.tn.forEach((el) => { const acc = el.classList.contains("secC-acc"); const p = c01((u - (acc ? 0.78 : 0.62)) / (acc ? 0.12 : 0.3)); el.setAttribute("opacity", f3(p)); });
        const pc = eLand(c01((u - 0.4) / 0.4));
        P.capS.style.transform = `translateY(${f1(22 * (1 - pc))}px)`;
        P.capI.style.transform = `scaleX(${f3(eLand(c01((u - 0.3) / 0.5)))})`;
        P.done = u > 1.3;
      });
      const hu = eLand(c01((t - 10.05) / 0.5));
      sbh.style.transform = `translateY(${f1(70 * (1 - hu))}px)`;
      sbm.style.transform = `translateY(${f1(50 * (1 - eLand(c01((t - 10.15) / 0.5))))}px)`;
    } else {
      sbh.style.transform = "translateY(70px)"; sbm.style.transform = "translateY(50px)";
    }
  }

  /* ---------------- timeline ---------------- */
  const tl = gsap.timeline({ paused: true });
  const drv = { t: 0 };
  // los paneles no tienen estado entre frames salvo "done": se recalculan al hacer seek hacia atrás
  const renderSafe = (t) => { if (t < (render.lt || 0)) PANS.forEach((P) => (P.done = false)); render.lt = t; render(t); };
  tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderSafe(drv.t) }, 0);
  renderSafe(0);

  /* ---------------- ajolote ---------------- */
  const ax = AxRig(tl, { prefix: "axC", seed: 47 });
  const AX1 = { x: 884, y: 1012, s: 0.7 };
  ax.init(0, AX1);
  const CLIP = "#axC-clipRect", HOP = "#axC-hop";
  tl.set(CLIP, { attr: { x: -3000, y: -3000, width: 6000, height: 6000 } }, 0.02);
  // L07 · «¿Una taza? ¿Un abrigo rojo? ¿Un coche de los ochenta? Apuntado.»
  const LV = CUES.env.lv;
  const lip = (g0, g1) => { const i0 = Math.round(g0 * FPS), i1 = Math.round(g1 * FPS); ax.lipsync(LV.slice(i0, i1), FPS, i0 / FPS - T0); };
  lip(24.5, 27.8);
  ax.mouth(3.32, "smile", 0.12);
  // mirada que guía: palabra → chip que vuela → palabra siguiente
  ax.look(0.28, -5, -4, 0.18);
  ax.look(CH[0].pop + 0.1, 3, -5, 0.3); ax.look(CH[0].land - 0.05, 5, -3, 0.16);
  ax.look(MK[1].t - 0.25, -4, -4, 0.18);
  ax.look(CH[1].pop + 0.1, 3, -4, 0.3); ax.look(CH[1].land - 0.05, 5, -2, 0.16);
  ax.blink(MK[2].t - 0.34);
  ax.look(MK[2].t - 0.2, -3, -3, 0.18);
  ax.look(CH[2].pop + 0.1, 3, -3, 0.3); ax.look(CH[2].land - 0.05, 5, -1, 0.16);
  ax.gillFlick(CH[0].land, 8, 0.6); ax.gillFlick(CH[1].land, 8, 0.6); ax.gillFlick(CH[2].land, 10, 0.6);
  // «Apuntado.» → señala arriba y cae el sello
  ax.point(STAMP.t - 0.5, { dir: "up", hold: 0.3, keep: true });
  ax.look(STAMP.t - 0.32, 2, -5, 0.12);
  ax.land(STAMP.t, 0.9);
  ax.eyes(STAMP.t, "sqz"); ax.mouth(STAMP.t, "grin", 0.06);
  ax.eyes(STAMP.t + 0.16, "happy");
  ax.unpoint(STAMP.t + 0.2, { side: "R" });

  // 8.0 · el ajolote, actor dentro de la viñeta 2C (recortado por el marco de la viñeta)
  const P2C = panRect(6), AXB = { x: P2C.l + 205, y: P2C.t + 168, s: 0.36 };
  ax.place(H.board, AXB);
  tl.set(CLIP, { attr: { x: (P2C.l - AXB.x) / AXB.s, y: (P2C.t - AXB.y) / AXB.s, width: SB.w / AXB.s, height: SB.h / AXB.s } }, H.board);
  tl.set("#axC-shadow", { opacity: 0, svgOrigin: "0 4" }, H.board + 0.02);
  tl.set(HOP, { y: 470, svgOrigin: "0 0" }, H.board + 0.03);
  const tIn = PANS[6].start + 0.3;
  ax.eyes(H.board + 0.04, "open"); ax.mouth(H.board + 0.04, "smile", 0);
  tl.fromTo(HOP, { y: 470 }, { y: -40, duration: 0.3, ease: "power3.out", svgOrigin: "0 0", immediateRender: false }, tIn);
  tl.fromTo(HOP, { y: -40 }, { y: 0, duration: 0.16, ease: "power2.in", svgOrigin: "0 0", immediateRender: false }, tIn + 0.3);
  tl.set("#axC-shadow", { opacity: 1, svgOrigin: "0 4" }, tIn + 0.44);
  // aterrizaje dentro de la viñeta (squash a mano: no pisa las branquias del saludo)
  tl.fromTo("#axC-squash", { scaleX: 1, scaleY: 1 }, { scaleX: 1.16, scaleY: 0.84, duration: 0.07, ease: "power2.out", svgOrigin: "0 0", immediateRender: false }, tIn + 0.46);
  tl.fromTo("#axC-squash", { scaleX: 1.16, scaleY: 0.84 }, { scaleX: 1, scaleY: 1, duration: 0.5, ease: "elastic.out(1.2,0.4)", svgOrigin: "0 0", immediateRender: false }, tIn + 0.53);
  ax.gillFlick(tIn + 0.05, 14, 0.4);
  ax.wave(tIn + 0.5, { side: "R", times: 1 });
  // L09 · «Y el estoribord, sale solo.»
  lip(34.62, 36.1);
  ax.mouth(11.62, "grin", 0.1);
  ax.look(11.42, 5, 0, 0.14);       // mira hacia donde va a irse la cámara
  ax.base(0, DUR);
  ax.blinks(0, DUR);

  window.__timelines["secC"] = tl;
})();
</script>
