    <div id="secD1-fore" class="secD1-plane" data-layout-allow-overflow>
      <i class="secD1-ruler" style="left: -200px; top: 18px; width: 2600px"></i>
      <i class="secD1-cross" style="left: 1820px; top: 70px"><b></b></i>

      <div class="secD1-tc" id="secD1-tc" style="left: 120px; top: 1030px">VD-02 ▸ PREPARAR · 00:00:36:15</div>

</div>

<script>
(function () {
  "use strict";
  const DUR = 3.5, T0 = 36.5, FPS = 30, FD = 1.25;
  const C = window.CUES;
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, e) => a + (b - a) * e;

  /* ---------- curvas propias vd.* ---------- */
  if (!window.__vdEases) {
    const bez = (x1, y1, x2, y2) => {
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
      const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
      return (p) => {
        if (p <= 0) return 0; if (p >= 1) return 1;
        let t = p;
        for (let i = 0; i < 6; i++) { const e = sx(t) - p, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }
        if (t < 0 || t > 1) { let lo = 0, hi = 1; t = p; for (let i = 0; i < 30; i++) { sx(t) < p ? (lo = t) : (hi = t); t = (lo + hi) / 2; } }
        return sy(t);
      };
    };
    const spring = (z = 0.42, w = 13) => (p) => (p >= 1 ? 1 : 1 - Math.exp(-z * w * p) * Math.cos(w * Math.sqrt(1 - z * z) * p));
    const E = {
      "vd.land": bez(0.16, 1, 0.3, 1), "vd.settle": bez(0, 0.65, 0.51, 0.99), "vd.glide": bez(0.7, 0, 0.2, 1),
      "vd.push": bez(0.33, 0, 0.67, 1), "vd.whip": bez(0.86, 0, 0.12, 1), "vd.dive": bez(0.55, 0, 0.95, 0.55),
      "vd.exit": bez(0.7, 0, 0.84, 0), "vd.spring": spring(),
      "vd.fold": (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    };
    Object.keys(E).forEach((k) => gsap.registerEase(k, E[k]));
    window.__vdEases = true;
  }

  const tl = gsap.timeline({ paused: true });

  /* ---------- CÁMARA: función pura de t (llega con latigazo desde la izquierda) ---------- */
  const K = [
    { t: 0.0, x: -170, y: 556, s: 1.0, r: 0.9 },
    { t: 0.38, x: 1052, y: 536, s: 1.0, r: -0.35, ease: "power3.out" },
    { t: 0.86, x: 960, y: 540, s: 1.0, r: 0, ease: "vd.land" },
    { t: 3.5, x: 990, y: 560, s: 1.05, r: 0.18, ease: "vd.push" },
  ];
  function cam(t) {
    if (t >= K[K.length - 1].t) return Object.assign({}, K[K.length - 1]);
    let i = 1;
    for (let k = 1; k < K.length; k++) if (t < K[k].t) { i = k; break; }
    const a = K[i - 1], b = K[i];
    const p = clamp((t - a.t) / (b.t - a.t || 1), 0, 1);
    const e = gsap.parseEase(b.ease || "none")(p);
    return { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), s: Math.exp(lerp(Math.log(a.s), Math.log(b.s), e)), r: lerp(a.r, b.r, e) };
  }
  const pulse = (dt) => (dt < 0 ? 0 : dt < 0.066 ? dt / 0.066 : Math.exp(-(dt - 0.066) * 9));
  const LANDT = [1.5, 1.75, 2.0, 2.25, 2.5];
  const camAt = (t) => {
    const c = cam(t);
    let k = 0;
    LANDT.forEach((lt, i) => (k += (i === 4 ? 0.016 : 0.006) * pulse(t - lt)));
    c.s *= 1 + k;
    return c;
  };
  const hand = (t) => ({
    x: 2.0 * Math.sin(2 * Math.PI * 0.31 * t + 1.3) + 0.9 * Math.sin(2 * Math.PI * 0.77 * t + 0.4),
    y: 1.5 * Math.sin(2 * Math.PI * 0.23 * t + 2.1) + 0.8 * Math.sin(2 * Math.PI * 0.91 * t + 5.2),
    r: 0.08 * Math.sin(2 * Math.PI * 0.17 * t + 0.7),
  });
  const world = $("#secD1-world"), forePl = $("#secD1-fore"), lens = $("#secD1-lens"), cbx = $("#secD1-cbx");
  function applyCamera(t) {
    const c = camAt(t), n = hand(t);
    [[world, 1], [forePl, FD]].forEach(([el, d]) => {
      const s = 1 + (c.s - 1) * d;
      el.style.transform = `translate(${(960 + n.x).toFixed(2)}px, ${(540 + n.y).toFixed(2)}px) rotate(${(c.r * d + n.r).toFixed(3)}deg) scale(${s.toFixed(4)}) translate(${(-c.x * d + 960 * (d - 1)).toFixed(2)}px, ${(-c.y * d + 540 * (d - 1)).toFixed(2)}px)`;
    });
    const h = 0.5 / FPS, c0 = camAt(Math.max(0, t - h)), c1 = camAt(Math.min(DUR, t + h));
    const vx = Math.abs(c1.x - c0.x) * c.s, vy = Math.abs(c1.y - c0.y) * c.s;
    const pan = Math.abs(Math.log(c1.s / c0.s)) < 0.006;
    const bx = pan ? Math.min(28, vx * 0.35) : 0, by = pan ? Math.min(28, vy * 0.35) : 0;
    if (bx + by > 0.8) { cbx.setAttribute("stdDeviation", `${bx.toFixed(2)} ${by.toFixed(2)}`); lens.style.filter = "url(#secD1-camblur)"; }
    else lens.style.filter = "none";
  }

  /* ---------- 1 · el latigazo aterriza y el montón se abre en abanico ---------- */
  // coordenadas de autor: centro de cada foto, giro final y punto de muestreo (relativo al centro)
  const PH = [
    { cx: 270, cy: 452, w: 270, h: 270, r: -6, smp: [-60, -18] },
    { cx: 590, cy: 438, w: 250, h: 300, r: 4, smp: [-62, 20] },
    { cx: 910, cy: 462, w: 250, h: 300, r: -3, smp: [0, 2] },
    { cx: 1230, cy: 444, w: 270, h: 270, r: 5, smp: [-74, 0] },
    { cx: 1550, cy: 456, w: 250, h: 300, r: -4, smp: [-48, 50] },
  ];
  const SC = 1.16;
  const COLS = ["#f0884a", "#24305e", "#e0402f", "#7f9a3e", "#9fb8bf"];
  const STACK_R = [-11, 7, -2, 10, -6];
  PH.forEach((p, i) => {
    const sx = 910 - p.cx + (i - 2) * 16, sy = 460 - p.cy - (i - 2) * 7;
    const d = 0.14 + Math.abs(i - 2) * 0.045;
    tl.fromTo("#secD1-ph" + i, { x: sx, y: sy, rotation: STACK_R[i], scale: 1.04, transformOrigin: "50% 50%" },
      { x: 0, y: 0, rotation: p.r, scale: SC, transformOrigin: "50% 50%", duration: 0.62, ease: "vd.land" }, d);
  });

  // rótulos: llegan con la cámara
  tl.fromTo("#secD1-kick", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "vd.land" }, 0.34);
  tl.fromTo("#secD1-title", { fontStretch: "62%", y: 34, opacity: 0 }, { fontStretch: "118%", y: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.46);
  tl.fromTo("#secD1-plab", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "vd.land" }, 1.36);

  /* ---------- 2 · el cuentagotas toma un color de cada foto; la ficha cae en su hueco (corcheas) ---------- */
  const rot = (x, y, a) => { const r = (a * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r); return [x * c - y * s, x * s + y * c]; };
  const SMP = PH.map((p) => { const v = rot(p.smp[0] * SC, p.smp[1] * SC, p.r); return [p.cx + v[0], p.cy + v[1]]; });
    const TOUCH = LANDT.map((lt) => lt - 0.3);
  const DR = "#secD1-drop";
  // entra desde arriba en el golpe de 1,0
  tl.set(DR, { scale: 0.96, transformOrigin: "45px 420px" }, 0);
  tl.set(DR, { opacity: 1 }, TOUCH[0] - 0.3);
  tl.fromTo(DR, { x: SMP[0][0] - 240, y: SMP[0][1] - 640, rotation: -44 }, { x: SMP[0][0], y: SMP[0][1], rotation: -26, duration: 0.3, ease: "vd.land" }, TOUCH[0] - 0.3);
  for (let i = 0; i < 5; i++) {
    const tt = TOUCH[i], [px, py] = SMP[i];
    // toque: aprieta la pera y el cristal se llena del color
    tl.set("#secD1-liq", { attr: { fill: COLS[i] } }, tt - 0.01);
    tl.fromTo("#secD1-liq", { scaleY: 0, svgOrigin: "45 424" }, { scaleY: 1, svgOrigin: "45 424", duration: 0.07, ease: "power2.out", immediateRender: false }, tt);
    tl.to("#secD1-bulb", { scaleX: 0.8, scaleY: 1.06, svgOrigin: "45 116", duration: 0.05, ease: "power2.out" }, tt);
    tl.to("#secD1-bulb", { scaleX: 1, scaleY: 1, svgOrigin: "45 116", duration: 0.16, ease: "elastic.out(1,0.5)" }, tt + 0.05);
    tl.to("#secD1-ph" + i, { scale: SC * 0.975, duration: 0.04, ease: "power2.out" }, tt);
    tl.to("#secD1-ph" + i, { scale: SC, duration: 0.18, ease: "power2.out" }, tt + 0.04);
    tl.set("#secD1-ring" + i, { left: px, top: py, borderColor: COLS[i] }, 0);
    tl.fromTo("#secD1-ring" + i, { scale: 0.3, opacity: 1 }, { scale: 1.5, opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, tt);
    // suelta la gota: cae (gravedad) y aterriza como ficha en el golpe
    const rel = tt + 0.08, lt = LANDT[i], ch = "#secD1-chip" + i;
    tl.to("#secD1-liq", { scaleY: 0.12, svgOrigin: "45 424", duration: 0.06, ease: "power2.in" }, rel);
    tl.set(ch, { borderRadius: "95px" }, 0);
    tl.set(ch, { opacity: 1 }, rel);
    tl.fromTo(ch, { y: py - 852, x: px - PH[i].cx, scaleX: 0.15, scaleY: 0.3 },
      { y: 0, x: 0, scaleX: 0.42, scaleY: 0.66, duration: lt - rel, ease: "power2.in", immediateRender: false }, rel);
    tl.to(ch, { keyframes: [{ scaleX: 1.14, scaleY: 0.82, borderRadius: "8px", duration: 0.05, ease: "power2.out" }, { scaleX: 0.97, scaleY: 1.04, duration: 0.08, ease: "power2.inOut" }, { scaleX: 1, scaleY: 1, duration: 0.18, ease: "vd.land" }] }, lt);
    tl.fromTo("#secD1-hx" + i, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.22, ease: "vd.land" }, lt + 0.06);
    tl.set("#secD1-spl" + i, { borderColor: COLS[i] }, 0);
    tl.fromTo("#secD1-spl" + i, { scale: 0.4, opacity: 0.9 }, { scale: 1.25, opacity: 0, duration: 0.32, ease: "power2.out", immediateRender: false }, lt);
    // salta a la foto siguiente (arco corto)
    if (i < 4) {
      const [nx, ny] = SMP[i + 1], d = TOUCH[i + 1] - (tt + 0.1);
      tl.to(DR, { x: nx, duration: d, ease: "power2.inOut" }, tt + 0.1);
      tl.to(DR, { y: Math.min(py, ny) - 70, duration: d * 0.45, ease: "power2.out" }, tt + 0.1);
      tl.to(DR, { y: ny, duration: d * 0.55, ease: "power2.in" }, tt + 0.1 + d * 0.45);
      tl.to(DR, { rotation: -34, duration: d * 0.45, ease: "power2.out" }, tt + 0.1);
      tl.to(DR, { rotation: -26, duration: d * 0.55, ease: "power2.in" }, tt + 0.1 + d * 0.45);
    }
  }
    // se va: arriba a la derecha, sin terminar (sale de cuadro)
  tl.to(DR, { x: 2150, y: -260, rotation: -12, duration: 0.5, ease: "vd.exit" }, TOUCH[4] + 0.16);

  // remate: el rotulador rojo rodea la referencia elegida (abrigo rojo) en el golpe de 2,75
  const loopP = $("#secD1-loopP"), loopA = $("#secD1-loopA");
  const LL = 1480, LA = 160;
  tl.fromTo(loopP, { attr: { "stroke-dasharray": LL, "stroke-dashoffset": LL } }, { attr: { "stroke-dasharray": LL, "stroke-dashoffset": 0 }, duration: 0.38, ease: "power2.inOut" }, 2.72);
  tl.fromTo(loopA, { attr: { "stroke-dasharray": LA, "stroke-dashoffset": LA } }, { attr: { "stroke-dasharray": LA, "stroke-dashoffset": 0 }, duration: 0.16, ease: "power2.out" }, 3.08);
  tl.to("#secD1-ph2", { rotation: -1, duration: 0.3, ease: "vd.land" }, 2.74);

  /* =====================================================================
     AJOLOTE (rig axD1): al natural sobre el opal
     ===================================================================== */
  const ax = AxRig(tl, { prefix: "axD1", seed: 41 });
  const R = (id) => "#axD1-" + id;
  const raw = (id, v, t) => tl.to(R(id), Object.assign({ svgOrigin: "0 0" }, v), t);
  const FEET = { x: 1784, y: 1012 }, AXS = 0.72;
  ax.init(0, { x: FEET.x, y: FEET.y, s: AXS });
  // inercia del latigazo: se inclina y las branquias siguen
  raw("tilt", { rotation: 7, duration: 0.2, ease: "power2.out" }, 0.04);
  raw("tilt", { rotation: 0, duration: 0.7, ease: "vd.spring" }, 0.3);
  ax.gillFlick(0.3, 18, 0.8);
  ax.look(0.36, -4, -2, 0.2);
  ax.brows(0.4, "up");
  // llama al cuentagotas señalando las fotos
  ax.point(0.78, { dir: "left", hold: 0.32 });
  // la mirada sigue al cuentagotas, foto a foto
  [[1.16, -5, -3], [1.44, -5, -1], [1.69, -4, -2], [1.94, -4, -1], [2.19, -3, -2], [2.44, -2, 2]].forEach(([t, x, y]) => ax.look(t, x, y, 0.12));
  [1.5, 1.75, 2.0, 2.25].forEach((t) => ax.gillFlick(t + 0.02, 7, 0.45));
  // la paleta completa: alegría (ojos ^ ^, rubor, saltito)
  ax.eyes(2.56, "happy"); ax.blush(2.56, 1.45); ax.brows(2.56, "up");
  ax.hopTo(2.56, { x: FEET.x, y: FEET.y, s: AXS, d: 0.34, arc: 52, lean: -1 });
  ax.eyes(3.12, "open"); ax.blush(3.12, 1.1); ax.brows(3.12, "neutral");
  ax.look(3.14, 0, 0, 0.18);

  const lip = (key) => {
    const v = C.vo[key], a = Math.round(v.t * FPS), b = Math.round((v.t + v.d) * FPS);
    ax.lipsync(C.env.lv.slice(a + 1, b), FPS, (a + 1) / FPS - T0);
  };
  lip("L10");
  ax.mouth(3.28, "grin", 0.12);

  ax.base(0, DUR);
  ax.blinks(0, 2.4);

  /* ---------- CONDUCTOR ÚNICO: cámara + timecode + tubos ---------- */
  const pcnt = $("#secD1-pcnt"); let lastN = -1;
  const tc = $("#secD1-tc"), tubes = [$("#secD1-tube0"), $("#secD1-tube1")];
  const tcode = (tg) => { const f = Math.floor(tg * 30 + 1e-6), ss = Math.floor(f / 30), ff = f % 30; return `00:00:${String(ss).padStart(2, "0")}:${String(ff).padStart(2, "0")}`; };
  function render(t) {
    applyCamera(t);
    tc.textContent = "VD-02 ▸ PREPARAR · " + tcode(T0 + t);
    let n = 0; LANDT.forEach((lt) => { if (t >= lt) n++; });
    if (n !== lastN) { pcnt.textContent = n + " / 5"; pcnt.style.color = n === 5 ? "#f0c94a" : "#f1eee6"; lastN = n; }
    tubes[0].style.transform = `translateY(${(14 * Math.sin(2 * Math.PI * t / 8 + 0.6)).toFixed(2)}px)`;
    tubes[1].style.transform = `translateY(${(-12 * Math.sin(2 * Math.PI * t / 8 + 1.9)).toFixed(2)}px)`;
  }
  const drv = { t: 0 };
  tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(drv.t) }, 0);
  render(0);

  window.__timelines["secD1"] = tl;
})();
