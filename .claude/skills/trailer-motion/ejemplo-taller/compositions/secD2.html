    tl.fromTo(av, { scale: 1 }, { scale: 0, duration: 0.06, ease: "power2.in", immediateRender: false }, pt);
    tl.set(av, { opacity: 1 }, rel);
    tl.set(av, { opacity: 0 }, pt + 0.06);
    tl.fromTo("#secD2-wv" + i, { scale: 1, opacity: 0.95 }, { scale: 1.9, opacity: 0, duration: 0.42, ease: "power2.out", immediateRender: false }, pt);
    tl.fromTo("#secD2-rg" + i, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, pt);
    tl.to("#secD2-av" + i, { scale: 1.1, duration: 0.06, ease: "power2.out" }, pt);
    tl.to("#secD2-av" + i, { scale: 1, duration: 0.3, ease: "vd.land" }, pt + 0.06);
    tl.set("#secD2-ck" + i, { opacity: 1 }, pt + 0.04);
    tl.fromTo("#secD2-ck" + i, { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.3, ease: "vd.spring", immediateRender: false }, pt + 0.04);
    tl.fromTo("#secD2-st" + i, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.22, ease: "vd.land" }, pt + 0.06);
  });

  /* =====================================================================
     4 · 47,0: se apaga todo; solo quedan el piloto REC y el ajolote
     ===================================================================== */
  const DARK = C.hits.dark - T0; // 5.5
  [[0, 1], [1, 0.25], [2, 1], [4, 0.55], [6, 1]].forEach(([f, o]) => tl.set("#secD2-dark", { opacity: o }, DARK + f / FPS));
  tl.set("#secD2-fore", { opacity: 0 }, DARK);
  tl.set("#axD2-svg", { filter: "none" }, DARK);
  tl.set("#axD2-cheekL, #axD2-cheekR", { attr: { filter: "none" } }, DARK);
  tl.set("#axD2-shadow", { opacity: 0, svgOrigin: "0 4" }, DARK + 0.02);
  // piloto: se enciende y parpadea a negras
  const ON = DARK + 2 / FPS;
  for (let t = ON, n = 0; t < DUR; n++, t = DARK + 0.5 * n) {
    const tOn = Math.max(t, ON), tOff = DARK + 0.5 * n + 0.38;
    tl.set("#secD2-led", { backgroundColor: "#f0503f" }, tOn);
    tl.set("#secD2-halo1", { opacity: 0.32 }, tOn); tl.set("#secD2-halo2", { opacity: 0.12 }, tOn); tl.set("#secD2-rec", { opacity: 1 }, tOn);
    if (tOff < DUR) {
      tl.set("#secD2-led", { backgroundColor: "#5a1c16" }, tOff);
      tl.set("#secD2-halo1", { opacity: 0 }, tOff); tl.set("#secD2-halo2", { opacity: 0 }, tOff); tl.set("#secD2-rec", { opacity: 0.35 }, tOff);
    }
  }
  tl.fromTo("#secD2-rec", { x: -10 }, { x: 0, duration: 0.3, ease: "vd.land" }, ON);
  // negro total exacto en 7,5 (49,0 global)
  tl.fromTo("#secD2-black", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, DUR - 0.1);

  /* =====================================================================
     AJOLOTE (rig axD2): pegatina sobre el gel; viaja montado en el avión
     ===================================================================== */
  const ax = AxRig(tl, { prefix: "axD2", seed: 57 });
  const R = (id) => "#axD2-" + id;
  const raw = (id, v, t) => tl.to(R(id), Object.assign({ svgOrigin: "0 0" }, v), t);
  ax.init(0, { x: 120, y: 300, s: AXS });
  ax.look(0.05, -5, -2, 0.2); ax.brows(0.08, "up");
  [0.3, 0.55, 0.8].forEach((t, i) => ax.look(t, -5 + i, -1, 0.12));
  ax.gillFlick(1.02, 14, 0.6);
  ax.look(1.04, -4, -2, 0.14);
  // salta al avión recién plegado; al caer, lo lanza
  const HOP = 1.6;
  ax.hopTo(HOP, { x: -20, y: -36, s: AXS, d: 0.3, arc: 120, lean: -1 });
  // en vuelo: se echa atrás contra el viento, brazos abiertos, branquias peinadas
  raw("tilt", { rotation: -11, duration: 0.3, ease: "power2.out" }, 2.12);
  raw("armL", { rotation: -74, duration: 0.3, ease: "back.out(2)" }, 2.06);
  raw("armR", { rotation: -70, duration: 0.3, ease: "back.out(2)" }, 2.09);
  ax.gills(2.1, -18, 0.25, "power2.out");
  ax.look(2.2, 4, 4, 0.18); ax.brows(2.2, "up");
  ax.eyes(2.95, "happy"); ax.blush(2.95, 1.4);
  ax.eyes(3.55, "open");
  // aterriza: inercia hacia delante
  raw("tilt", { rotation: 13, duration: 0.14, ease: "power2.out" }, 4.08);
  raw("tilt", { rotation: 0, duration: 0.24, ease: "power2.out" }, 4.22);
  raw("armL", { rotation: 0, duration: 0.35, ease: "back.out(1.6)" }, 4.1);
  raw("armR", { rotation: 0, duration: 0.35, ease: "back.out(1.6)" }, 4.12);
  ax.gillFlick(4.1, 18, 0.8);
  ax.look(4.12, 0, 0, 0.15);
  // baja de un salto junto a la cámara de cine
  ax.hopTo(4.36, { x: FEET_END.x, y: FEET_END.y, s: AXS, d: 0.36, arc: 80, lean: 1 });
  ax.eyes(4.9, "happy"); ax.blush(4.9, 1.35);
  ax.eyes(5.36, "open"); ax.blush(5.36, 1);
  ax.look(5.38, 0, 0, 0.16);
  ax.brows(DARK + 0.05, "worried", 0.3);
  ax.brows(6.3, "neutral", 0.4);

  const lip = (key) => {
    const v = C.vo[key], a = Math.round(v.t * FPS), b = Math.round((v.t + v.d) * FPS);
    ax.lipsync(C.env.lv.slice(a + 1, b), FPS, (a + 1) / FPS - T0);
  };
  lip("L11");
  ax.mouth(3.45, "grin", 0.12);
  ax.mouth(5.2, "smile", 0.15);
  lip("L12");
  ax.mouth(7.08, "smile", 0.12);

  ax.base(0, DUR);
  ax.blinks(0, 5.9);

  // para el picado, la cabeza tiene que estar quieta: se recortan respiración/cabeceo y se llevan a neutro
  const TRIM = 6.0;
  const yoyoV = (t, st, d, reps, a, b, ease) => {
    const n = reps + 1, tt = clamp(t - st, 0, n * d);
    let k = Math.floor(tt / d), u = (tt - k * d) / d;
    if (k >= n) { k = n - 1; u = 1; }
    const e = gsap.parseEase(ease)(u);
    return a + (b - a) * (k % 2 ? 1 - e : e);
  };
  const reps = (c) => Math.max(0, Math.floor(DUR / c) - 1);
  const IDLE = {
    "axD2-breath": (t) => ({ scaleY: yoyoV(t, 0, 1.15, reps(1.15), 1, 1.035, "sine.inOut"), scaleX: yoyoV(t, 0, 1.15, reps(1.15), 1, 0.986, "sine.inOut") }),
    "axD2-headBob": (t) => ({ y: yoyoV(t, 0.2, 1.15, reps(1.15) - 1, 0, 3, "sine.inOut") }),
    "axD2-headBobR": (t) => ({ rotation: yoyoV(t, 0.4, 1.7, reps(1.7) - 1, -1.2, 1.2, "sine.inOut") }),
  };
  tl.getChildren(false, true, false).forEach((tw) => {
    const tg = tw.targets && tw.targets()[0];
    if (!tg || !IDLE[tg.id]) return;
    const st = tw.startTime(), en = st + tw.totalDuration();
    if (st < TRIM && en > TRIM) tw.totalDuration(TRIM - st);
  });
  const NEUT = { "axD2-breath": { scaleY: 1, scaleX: 1 }, "axD2-headBob": { y: 0 }, "axD2-headBobR": { rotation: 0 } };
  Object.keys(IDLE).forEach((id) => {
    const org = id === "axD2-headBobR" ? "0 -132" : "0 0";
    tl.fromTo("#" + id, Object.assign({ svgOrigin: org }, IDLE[id](TRIM)), Object.assign({ svgOrigin: org, duration: 0.35, ease: "power2.inOut", immediateRender: false }, NEUT[id]), TRIM);
  });

  /* =====================================================================
     CONDUCTOR ÚNICO: cámara, bloques, plegado, avión, contador
     ===================================================================== */
  const pw = $("#secD2-pw"), aw = $("#secD2-aw");
  const winds = [0, 1, 2].map((i) => $("#secD2-w" + i));
  let lastN = -1;
  function render(t) {
    applyCamera(t);
    renderBlocks(t);
    renderFold(t);
    const p = planeState(t);
    const tr = `translate(${p.x.toFixed(2)}px, ${p.y.toFixed(2)}px) rotate(${p.rot.toFixed(3)}deg)`;
    pw.style.transform = tr; aw.style.transform = tr;
    const k = clamp(p.sp / V, 0, 1.2);
    winds.forEach((w, i) => {
      const fl = 0.75 + 0.25 * Math.sin(2 * Math.PI * 7 * t + i * 2.1);
      w.style.transform = `scaleX(${(k * fl).toFixed(3)})`;
      w.style.opacity = (Math.min(1, k) * 0.55).toFixed(3);
    });
    let n = 0; PING.forEach((pt) => { if (t >= pt) n++; });
    if (n !== lastN) { cnEl.textContent = n + "/5"; cnEl.style.color = n === 5 ? "#4fc47f" : "#f1eee6"; lastN = n; }
  }
  const drv = { t: 0 };
  tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(drv.t) }, 0);
  render(0);

  window.__timelines["secD2"] = tl;
})();
</script>
</template>
</body>
