      numEls[j].style.transform = `scale(${k.toFixed(4)})`;
      marks[j].forEach((m, i) => {
        const a = i < L.length ? clamp((t - L[i]) / 0.07, 0, 1) : 0;
        m.style.transform = (i % 5 === 4 ? "rotate(-26deg) scaleX(" : "scaleY(") + a.toFixed(3) + ")";
      });
    });
    const pv = Math.round(85 * pctE(clamp((t - 8.95) / 1.1, 0, 1)));
    if (pv !== last[3]) { pct.textContent = pv + "%"; last[3] = pv; }
    tc1.textContent = "VD-01 ▸ ESCRIBIR · " + tcode(T0 + t);
    tc2.textContent = "VD-02 ▸ PREPARAR · " + tcode(T0 + t);
    BUBS.forEach(([bx, by, sp, ph], i) => {
      const cyc = 2.6 / sp, u = ((t + ph * cyc) % cyc) / cyc;
      const y = by - u * 300, x = bx + 7 * Math.sin(2 * Math.PI * (1.3 * t * sp + ph * 3));
      const o = u < 0.12 ? u / 0.12 : u > 0.75 ? Math.max(0, (1 - u) / 0.25) : 1;
      bubEls[i].style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(0.6 + 0.5 * sp).toFixed(2)})`;
      bubEls[i].style.opacity = (o * 0.9).toFixed(3);
    });
  }
  const drv = { t: 0 };
  tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(drv.t) }, 0);
  render(0);

  window.__timelines["secB"] = tl;
})();
</script>
</template>
