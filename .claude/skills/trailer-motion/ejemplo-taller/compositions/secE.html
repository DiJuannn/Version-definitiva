    const mi = Math.floor((t - T_DROP) / SHOT + 1e-6);
    const swX = lerp(1940, -4300, eWhip(seg(t, T_SWP, T_DROP + 0.03)));
    const revealed = t >= T_SWP && swX <= -624;
    sc.m.forEach((el, i) => vis(el, (i === mi && t >= T_DROP && t < M8) || (i === 0 && revealed && t < T_DROP + SHOT)));
    vis(sc.end, t >= T_RW && t < T_END);
    vis(sc.blk, t >= T_END);
    const axOn = (t < T_BLK) || (t >= T_DROP + 4 * SHOT && t < T_DROP + 5 * SHOT) || (t >= T_STG - 0.1 && t < T_END);
    vis(sc.ax, axOn);

    // --- cámara del plató ---
    if (inS1) {
      const c = cam1(t);
      setCam(sc.w1, c, 1, t + T0);
      setCam(sc.fore1, c, 1.25, t + T0);
      if (axOn) setCam(sc.ax, c, 1, t + T0);
      // palo + estela (4 sub-muestras dentro del obturador de 1 f)
      const a = stickA(t);
      stick.style.transform = `rotate(${a.toFixed(3)}deg)`;
      ghosts.forEach((g, k) => {
        const ag = stickA(t - ((k + 1) / 6) * (1.2 / FPS));
        const on = Math.abs(ag - a) > 0.4;
        g.style.transform = `rotate(${ag.toFixed(3)}deg)`;
        g.style.opacity = on ? (0.26 - k * 0.032).toFixed(3) : "0";
      });
      // temblor del cuerpo de la claqueta en el golpe
      const dt = t - T_CLAC;
      const sk = dt >= 0 && t < M8 ? 9 * Math.sin(dt * 110) * Math.exp(-dt * 22) : 0;
      slateK.style.transform = `translate(${(sk * 0.4).toFixed(2)}px, ${(Math.abs(sk)).toFixed(2)}px)`;
      // perforaciones: la película corre a 24 fps y se para en el silencio
      const tf = Math.min(t, T_SIL);
      const py = (Math.floor(tf * 24) * 19) % 54;
      pl.style.backgroundPosition = `0px ${py}px`; pr.style.backgroundPosition = `0px ${py}px`;
      const fr = Math.floor((t + T0) * 24);
      txt(edge, "edge", `VD-03 ▸ RODAR ▸ 24 FPS ▸ KD ${String(Math.floor(fr / 16)).padStart(4, "0")}+${String(fr % 16).padStart(2, "0")}`);
      txt(rect, "rec", "REC " + tcode(t + T0));
      recdot.style.opacity = Math.floor((t + T0) * 2) % 2 === 0 ? "1" : "0.2";
      const m8 = t >= M8;
      dig1.style.opacity = m8 ? "0" : "1"; dig2.style.opacity = m8 ? "1" : "0";
      slamEl.style.opacity = m8 ? "0" : "1";
    } else if (axOn) {
      sc.ax.style.transform = "none";
    }

    // --- montaje: reloj de rodaje vivo ---
    if (t >= T_SWP && t < T_DROP + SHOT) {
      const s = 7 * 3600 + 42 * 60 + 16 + (t - T_DROP) * 24;
      const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = Math.floor(s % 60);
      txt(m1tc, "m1", `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`);
    }

    // --- rayas del palo a pantalla completa (barren de derecha a izquierda) ---
    const su = seg(t, T_SWP, T_DROP + 0.03);
    vis(sc.stripes, t >= T_SWP && t < T_DROP + 0.03);
    if (t >= T_SWP && t < T_DROP + 0.03) sc.stripes.style.transform = `translateX(${swX.toFixed(1)}px)`;

    // --- rebobinado ---
    if (t >= T_RW && t < T_END) {
      const c = cam2(t);
      strip.style.transform = `translate(960px, 540px) scale(${c.s.toFixed(5)}) translate(${(-c.x).toFixed(2)}px, ${(-c.y).toFixed(2)}px)`;
      // estela de cámara (solo en los saltos, nunca en el dezoom)
      const h = 0.5 / FPS, c0 = cam2(Math.max(T_RW, t - h)), c1 = cam2(t + h);
      const v = Math.abs(c1.x - c0.x) * c.s;
      const pan = Math.abs(Math.log(c1.s / c0.s)) < 0.02;
      const bx = pan ? Math.min(28, v * 0.3) : 0;
      if (bx > 0.6) { cbx.setAttribute("stdDeviation", `${bx.toFixed(2)} 0`); rwlens.style.filter = "url(#secE-camblur)"; }
      else if (rwlens.style.filter !== "none") rwlens.style.filter = "none";
      // contador ◀◀ que baja con el fotograma centrado
      const fi = clamp((c.x - FX(0)) / 560, 0, 6), f0 = Math.floor(fi), f1 = Math.min(6, f0 + 1);
      const tcv = lerp(FR_TC[f0], FR_TC[f1], fi - f0);
      txt(hud2, "hud2", tcode(t < T_DEZ ? tcv : FR_TC[0]));
      const hudOn = t < T_COND;
      hud.style.opacity = hudOn ? (Math.floor(t * 6) % 2 === 0 ? "1" : "0.55") : "0";
      hud2.style.opacity = hudOn ? "1" : "0";
      // la película se recoge y los fotogramas se condensan en franjas de gel que vuelan al logo
      const fu = eP3out(seg(t, T_COND - 0.05, T_COND + 0.25));
      film.style.transform = `scaleY(${(1 - fu).toFixed(4)})`;
      film.style.opacity = (1 - fu).toFixed(3);
      frs.forEach((el, i) => {
        const a = T_COND + i * 0.035;
        const sq = eP3out(seg(t, a, a + 0.16));     // se aplasta
        const fl = eGlide(seg(t, a + 0.06, a + 0.48)); // vuela a la barra
        const g = seg(t, a, a + 0.1);
        fgels[i].style.opacity = g.toFixed(3);
        const tgx = (TGT[i].x - 960) / c.s + c.x, tgy = (BAR.y - 540) / c.s + c.y;
        const fx = FX(i), fy = 0;
        const sx = lerp(1, lerp(0.86, TGT[i].w / c.s / 520, fl), sq);
        const sy = lerp(1, (BAR.h / c.s) / 292, sq);
        const arc = -Math.sin(Math.PI * fl) * 160 * (1 - i / 9);
        const x = lerp(fx, tgx, fl) - fx, y = lerp(fy, tgy, fl) + arc;
        el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
        el.style.borderRadius = sq > 0.5 ? "0" : "4px";
      });
      vis(strip, t < T_LOGO + 0.02);
      vis(sc.logo, t >= T_LOGO);
    }
  }

  /* =====================================================================
     GOLPES CON GSAP (tipografía y pequeños gestos)
     ===================================================================== */
  // ¡ACCIÓN! entra en «Acción» (vd.slam: 1.9 → 0.94 → 1.02 → 1) letra a letra a 1 f
  {
    const slam = $("#secE-slam span");
    const chars = Array.from(slam.textContent);
    slam.innerHTML = chars.map((ch, i) => `<span class="secE-ch" id="secE-ch${i}" style="display:inline-block">${ch}</span>`).join("");
    chars.forEach((_, i) => {
      const t = T_ACC + 0.02 + i * (1 / FPS);
      tl.fromTo("#secE-ch" + i, { opacity: 0, scale: 1.9, y: -30 }, { opacity: 1, scale: 0.94, y: 6, duration: 0.1, ease: "power4.out" }, t);
      tl.to("#secE-ch" + i, { scale: 1.02, y: -2, duration: 0.06, ease: "power2.out" }, t + 0.1);
      tl.to("#secE-ch" + i, { scale: 1, y: 0, duration: 0.1, ease: "power2.out" }, t + 0.16);
    });
    // en el CLAC el rótulo da un respingo
    tl.fromTo("#secE-slam", { y: 0 }, { y: 12, duration: 0.033, ease: "none" }, T_CLAC);
    tl.to("#secE-slam", { y: 0, duration: 0.2, ease: "power2.out" }, T_CLAC + 0.033);
  }

  // M1 (drop): punch de llegada; la celda «en curso» late
  tl.fromTo("#secE-m1i", { scale: 1.14, rotation: 1.5 }, { scale: 1.0, rotation: 0, duration: 0.3, ease: "vd.land" }, T_DROP - 0.12);
  tl.fromTo("#secE-m1live", { scaleX: 0.2 }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.2, ease: "vd.land" }, T_DROP);
  // M2: TOMA 2
  tl.fromTo("#secE-m2i", { x: 60 }, { x: 0, duration: 0.25, ease: "none" }, T_DROP + SHOT);
  tl.fromTo("#secE-m2n", { scale: 1.5, rotation: -14 }, { scale: 1, rotation: -4, duration: 0.18, ease: "power4.out" }, T_DROP + SHOT);
  // M3: TOMA 3 + ✓ buena
  tl.fromTo("#secE-m3i", { x: -60 }, { x: 0, duration: 0.25, ease: "none" }, T_DROP + 2 * SHOT);
  tl.fromTo("#secE-m3n", { scale: 1.5, rotation: 14 }, { scale: 1, rotation: 4, duration: 0.18, ease: "power4.out" }, T_DROP + 2 * SHOT);
  tl.fromTo("#secE-m3p", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: "vd.land" }, T_DROP + 2 * SHOT + 0.1);
  // M4: ✓ que se dibuja + escena rodada
  tl.fromTo("#secE-chk", { attr: { "stroke-dashoffset": 1000 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.17, ease: "power3.out" }, T_DROP + 3 * SHOT);
  tl.fromTo("#secE-m4i", { scale: 1.06 }, { scale: 1, duration: 0.25, ease: "vd.land" }, T_DROP + 3 * SHOT);
  // M5: ¡BUENA!
  tl.fromTo("#secE-m5i", { scale: 1.2 }, { scale: 1, duration: 0.2, ease: "power4.out" }, T_DROP + 4 * SHOT);
  // M6: la lista se tacha en cascada
  tl.fromTo("#secE-m6i", { y: 40 }, { y: -10, duration: 0.25, ease: "none" }, T_DROP + 5 * SHOT);
  [0, 1, 2, 3, 4].forEach((i) => tl.fromTo("#secE-r" + i, { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.1, ease: "vd.land" }, T_DROP + 5 * SHOT + 0.01 + i * 0.03));
  // M7: JORNADA 1 → 2, la barra avanza
  tl.fromTo("#secE-m7i", { x: 40 }, { x: -20, duration: 0.25, ease: "none" }, T_DROP + 6 * SHOT);
  tl.fromTo(["#secE-m7a", "#secE-m7b"], { y: 0 }, { y: -400, duration: 0.14, ease: "power3.inOut" }, T_DROP + 6 * SHOT + 0.05);
  tl.fromTo("#secE-m7bar", { scaleX: 0.33 }, { scaleX: 0.66, duration: 0.18, ease: "vd.land" }, T_DROP + 6 * SHOT + 0.04);

  // ---- LOGO ----
  // «Versión definitiva» se abre desde la barra de gel: wdth 62 → 118 + sube del filo
  tl.fromTo("#secE-word", { fontStretch: "62%", y: 215 }, { fontStretch: "118%", y: 0, duration: 0.75, ease: "vd.settle" }, T_LOGO);
  // la barra: escribir y preparar ya llegaron; rodar entra con el nombre; entregar se completa en el button
  tl.fromTo("#secE-sg2", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "vd.land" }, T_LOGO + 0.08);
  tl.fromTo("#secE-sg3", { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "vd.land" }, T_BTN - 0.03);
  ["#secE-sl0", "#secE-sl1", "#secE-sl2"].forEach((s, i) => tl.fromTo(s, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease: "vd.land" }, T_LOGO + 0.3 + i * 0.07));
  tl.fromTo("#secE-sl3", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease: "vd.land" }, T_BTN + 0.12);
  // TALLER sube del filo en la palabra «Taller» de la voz
  const T_TALLER = C.vo.L15.t - T0 + 1.07;
  tl.fromTo("#secE-taller", { y: 100, fontStretch: "62%" }, { y: 0, duration: 0.5, ease: "vd.land" }, T_TALLER);
  // CTA con «…empieza aquí»
  const T_CTA = C.vo.L15.t - T0 + 1.9;
  tl.fromTo("#secE-cta", { opacity: 0, y: 40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "vd.land" }, T_CTA);
  tl.fromTo("#secE-arrow", { x: -12 }, { x: 0, duration: 0.5, ease: "vd.land" }, T_CTA + 0.1);
  // tagline al acabar la voz (dos golpes)
  const T_TAG = C.vo.L15.t + C.vo.L15.d - T0 + 0.06;
  tl.fromTo("#secE-t1", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "vd.land" }, T_TAG);
  tl.fromTo("#secE-t2", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "vd.land" }, T_TAG + 0.25);
  // button: la barra se completa en verde, el CTA late una vez, ping verde
  tl.to("#secE-cta", { scale: 1.05, duration: 0.08, ease: "power2.out" }, T_BTN);
  tl.to("#secE-cta", { scale: 1, duration: 0.45, ease: "vd.settle" }, T_BTN + 0.08);
  tl.to("#secE-arrow", { x: 14, duration: 0.1, ease: "power2.out" }, T_BTN);
  tl.to("#secE-arrow", { x: 0, duration: 0.4, ease: "vd.settle" }, T_BTN + 0.1);
  tl.fromTo("#secE-ping", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.05, ease: "none" }, T_BTN + 0.3);
  tl.to("#secE-ping", { scale: 3.4, opacity: 0, duration: 0.6, ease: "power2.out" }, T_BTN + 0.35);
  // logo: push lento continuo (1.00 → 1.035) que no deja el plano congelado
  tl.fromTo("#secE-logo", { scale: 1 }, { scale: 1.035, duration: T_END - T_LOGO, ease: "vd.push" }, T_LOGO);

  /* =====================================================================
     AJOLOTE (rig axE)
     ===================================================================== */
  const ax = AxRig(tl, { prefix: "axE", seed: 65 });
  const AX = "#axE";
  const raw = (id, v, t) => tl.to("#axE-" + id, Object.assign({ svgOrigin: id === "head" ? "0 -132" : "0 0" }, v), t);
  const lip = (key, cut) => {
    const v = C.vo[key], a = Math.round(v.t * FPS), b = Math.round((v.t + (cut || v.d)) * FPS);
    ax.lipsync(C.env.lv.slice(a + 1, b), FPS, (a + 1) / FPS - T0);
  };
  // --- E1: sostiene la claqueta con las dos manos, en tensión ---
  ax.init(0, { x: 1505, y: 1072, s: 1.1 });
  tl.set("#axE-shadow", { opacity: 0, svgOrigin: "0 4" }, 0.01);
  raw("armL", { rotation: -96, duration: 0.01 }, 0.02);
  raw("armLs", { scaleY: 1.5, duration: 0.01 }, 0.02);
  raw("armR", { rotation: -30, duration: 0.01 }, 0.02);
  raw("tilt", { rotation: -6, duration: 0.01 }, 0.02);
  ax.look(0.03, -5, -3, 0.01);
  ax.brows(0.03, "worried", 0.01);
  // «Preparados…» (susurro): sube un poco la claqueta, labios pequeños
  raw("hop", { y: -10, duration: 0.6, ease: "power2.out" }, 0.05);
  lip("L13a");
  ax.mouth(0.92, "hmm", 0.08);
  // silencio total: contiene la respiración (mejillas, ojos muy abiertos)
  tl.to("#axE-eyeL, #axE-eyeR", { scale: 1.12, svgOrigin: "0 0", duration: 0.25, ease: "power2.out" }, T_SIL);
  ax.blush(T_SIL, 1.35, 0.4);
  ax.look(T_SIL + 0.35, 0, -1, 0.14);   // mira a cámara (lo sabe)
  ax.look(T_SIL + 0.62, -5, -3, 0.12);  // vuelve a la claqueta
  // «¡Acción!»: se echa hacia atrás con el palo (anticipación), ceño
  raw("tilt", { rotation: -9, duration: 0.3, ease: "power2.out" }, T_ACC);
  raw("hop", { y: -18, duration: 0.3, ease: "power2.out" }, T_ACC);
  ax.brows(T_ACC, "angry", 0.12);
  tl.to("#axE-eyeL, #axE-eyeR", { scale: 1, svgOrigin: "0 0", duration: 0.12, ease: "power2.out" }, T_ACC);
  lip("L13b");
  // CLAC: ojos apretados, golpe hacia abajo
  ax.eyes(T_CLAC - 0.03, "sqz");
  raw("hop", { y: 6, duration: 0.05, ease: "power4.in" }, T_CLAC - 0.05);
  raw("squash", { scaleX: 1.12, scaleY: 0.88, duration: 0.05, ease: "power2.out" }, T_CLAC);
  raw("tilt", { rotation: 2, duration: 0.06, ease: "power4.in" }, T_CLAC - 0.06);
  ax.gillFlick(T_CLAC, 18, 0.6);

  // --- M5: ¡BUENA! salta de alegría (pegatina grande) ---
  const TM5 = T_DROP + 4 * SHOT;
  ax.place(TM5 - 0.06, { x: 960, y: 1010, s: 1.25 });
  tl.set("#axE-hop", { y: 0, svgOrigin: "0 0" }, TM5 - 0.05);
  tl.set("#axE-tilt", { rotation: 0, svgOrigin: "0 0" }, TM5 - 0.05);
  ax.expr(TM5 - 0.04, "laugh", 0.01);
  raw("armL", { rotation: -150, duration: 0.06, ease: "power2.out" }, TM5 - 0.04);
  raw("armR", { rotation: -150, duration: 0.06, ease: "power2.out" }, TM5 - 0.04);
  raw("armLs", { scaleY: 1.4, duration: 0.06 }, TM5 - 0.04);
  raw("armRs", { scaleY: 1.4, duration: 0.06 }, TM5 - 0.04);
  raw("squash", { scaleX: 0.86, scaleY: 1.16, duration: 0.08, ease: "power2.out" }, TM5);
  raw("hop", { y: -90, duration: 0.2, ease: "power3.out" }, TM5);
  raw("tilt", { rotation: 6, duration: 0.2, ease: "power2.out" }, TM5);
  raw("squash", { scaleX: 1, scaleY: 1, duration: 0.16, ease: "vd.spring" }, TM5 + 0.08);
  ax.gills(TM5, 22, 0.14, "power2.out");

  // --- STINGER: asoma por abajo con la claqueta mini, mira a cámara, ladea la cabeza ---
  ax.place(T_STG - 0.3, { x: 1640, y: 1400, s: 1.12 });
  ["armL", "armR"].forEach((a) => tl.set("#axE-" + a, { rotation: 0, svgOrigin: "0 0" }, T_STG - 0.29));
  ["armLs", "armRs"].forEach((a) => tl.set("#axE-" + a, { scaleY: 1, svgOrigin: "0 0" }, T_STG - 0.29));
  tl.set("#axE-hop", { y: 0, svgOrigin: "0 0" }, T_STG - 0.29);
  tl.set("#axE-tilt", { rotation: 0, svgOrigin: "0 0" }, T_STG - 0.29);
  tl.set("#axE-squash", { scaleX: 1, scaleY: 1, svgOrigin: "0 0" }, T_STG - 0.29);
  ax.gills(T_STG - 0.29, 0, 0.01);
  ax.expr(T_STG - 0.28, "neutral", 0.01);
  ax.blush(T_STG - 0.28, 1, 0.01);
  ax.look(T_STG - 0.28, 4, -2, 0.01);
  // sube del borde inferior (con un pequeño rebote de personaje)
  tl.fromTo(AX, { y: 1400 }, { y: 1086, duration: 0.42, ease: "back.out(1.7)", immediateRender: false }, T_STG - 0.12);
  ax.clapIn(T_STG + 0.06);
  ax.look(T_STG + 0.5, 0, 0, 0.16);  // a cámara
  lip("L16");
  raw("head", { rotation: 13, duration: 0.42, ease: "back.out(2.2)" }, T_STG + 0.72); // ladea la cabeza: «¿por seguridad?»
  ax.brows(T_STG + 0.72, "up", 0.2);
  // mini-clac a las 65.0 (anticipación −27°, cierre en 2 f)
  const OPEN = T_MINI - 0.36;
  raw("clapStick", { rotation: -28, duration: 0.2, ease: "back.out(1.8)" }, OPEN);
  raw("clapStick", { rotation: 0, duration: 0.07, ease: "power4.in" }, T_MINI - 0.07);
  raw("clapY", { y: 5, duration: 0.05, ease: "power2.out" }, T_MINI);
  raw("clapY", { y: 0, duration: 0.2, ease: "power2.out" }, T_MINI + 0.05);
  raw("squash", { scaleY: 0.9, scaleX: 1.08, duration: 0.05, ease: "power2.out" }, T_MINI);
  tl.set("#axE-fxImpact", { opacity: 1, svgOrigin: "0 0" }, T_MINI);
  tl.fromTo("#axE-fxImpact", { scale: 0.5, svgOrigin: "0 0" }, { scale: 1.25, svgOrigin: "0 0", duration: 0.2, ease: "power3.out", immediateRender: false }, T_MINI);
  ax.eyes(T_MINI, "sqz"); ax.mouth(T_MINI, "grin", 0.06);
  ax.gillFlick(T_MINI, 16, 0.5);

  ax.base(0, T_SIL);              // en el silencio hasta la respiración se para
  ax.base(T_DROP, DUR);
  ax.blinks(T_STG, T_MINI - 0.3);

  /* =====================================================================
     CONDUCTOR ÚNICO
     ===================================================================== */
  const drv = { t: 0 };
  tl.fromTo(drv, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(drv.t) }, 0);
  render(0);

  window.__timelines["secE"] = tl;
})();
</script>
</template>
</body>
